  Wayfair — one price, no sale, in stock.

  The other half of the Wayfair pair. Same sanitization rules as
  `wayfair-sale-out-of-stock.html`: real structural hooks, invented product and prices.

  ## What differs, and why it matters

  1. The price sits under `data-test-id="StandardPricingPrice-PRIMARY"`, not `-SALE`. The real
     page uses PRIMARY when there is no promotion, so an adapter keyed only on `-SALE` finds
     nothing here. Both must be read.
  2. There is NO `-PREVIOUS` block, so `originalPriceAmount` must come out null. A former price
     invented by pairing this figure with a recommendation tile's strikethrough would be a
     fabricated discount — the failure the cue-gated resolver was tightened to avoid.
  3. Availability is IN_STOCK, and the page renders an Add to Cart button rather than Notify Me.
  4. One option category, not two, so a variant map with a single entry is the expected shape.

  Still no Product JSON-LD — that is constant for this retailer and is the reason an adapter is
  needed at all.
-->
