<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kestrel Rain Shell — Fieldcraft</title>
    <link rel="canonical" href="https://www.fieldcraft.example/kestrel-rain-shell.html" />
    <link
      rel="stylesheet"
      href="https://www.fieldcraft.example/on/demandware.static/-/css/style.css"
    />
    <meta itemprop="priceCurrency" content="CAD" />
  </head>
  <body>
    <div class="product-detail product-wrapper" data-pid="KRS-0042-SLT-M">
      <div class="primary-images">
        <div class="carousel-item active">
          <img class="product-image" src="/dw/image/v2/kestrel-slate.jpg" alt="" />
        </div>
      </div>

      <h1 class="product-name">Kestrel Rain Shell</h1>
      <div class="product-brand">Fieldcraft</div>

      <!--
        SFRA writes the machine-readable amount into `content` and the localized string as
        text. Reading the attribute avoids re-parsing "CA$ 189.00".
      -->
      <div class="prices">
        <span class="strike-through list">
          <span class="value" content="245.00">CA$ 245.00</span>
        </span>
        <span class="sales">
          <span class="value" content="189.00">CA$ 189.00</span>
        </span>
      </div>

      <div class="attributes">
        <div class="attribute" data-attr="color">
          <span class="non-input-label">Colour:</span>
          <span class="selected-value">Slate</span>
        </div>
        <div class="attribute" data-attr="size">
          <span class="non-input-label">Size:</span>
          <span class="selected-value">Medium</span>
        </div>
      </div>

      <div class="availability" data-ready-to-order="true">
        <div class="availability-msg">In Stock</div>
      </div>
    </div>
  </body>
</html>
