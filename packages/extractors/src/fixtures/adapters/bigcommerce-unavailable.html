<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cirrus Floor Lamp — Lumenworks</title>
    <link rel="canonical" href="https://lumenworks.example/cirrus-floor-lamp/" />
  </head>
  <body>
    <section class="productView" data-product-id="4822">
      <h1 class="productView-title">Cirrus Floor Lamp</h1>

      <div class="productView-price">
        <span class="price--withoutTax" data-product-price-without-tax>$310.00</span>
      </div>

      <dl class="productView-info">
        <dd class="productView-info-value" data-product-sku>CIR-FL-WHT</dd>
      </dl>

      <!--
        No stock element at all — the only signal the theme gives is that the button is
        disabled. Lower confidence than a stated stock status, and marked as such.
      -->
      <form data-cart-item-add>
        <button id="form-action-addToCart" data-button-purchase disabled>Add to Cart</button>
      </form>
    </section>
  </body>
</html>
