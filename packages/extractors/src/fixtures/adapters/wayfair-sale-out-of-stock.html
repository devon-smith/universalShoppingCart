<!doctype html>
<!--
  Wayfair — a sale price beside a struck former price, on an out-of-stock listing.

  Sanitized and reduced from the structure of a real product page: the `data-test-id` and
  `data-node-id` hooks, the `data-hb-id="BoxV3"` wrappers, the hashed `_6o3atz*` class names,
  the visually-hidden "was", and the `data-clio-context` payload on each option swatch are
  reproduced faithfully. The product, prices, images and option names are invented. No
  account data, no cookies, no tokens, no real listing.

  ## Why this fixture exists

  The page carries NO Product JSON-LD — only WebSite and BreadcrumbList, exactly as the real
  page does. That is the whole reason Wayfair currently extracts no price at all: there is no
  offer for the structured-data tier to read, and the generic DOM heuristics do not recognise
  `data-test-id="PriceDisplay"`. Do not add a Product node to this fixture; its absence IS the
  case under test.

  ## The trap this fixture sets

  `[data-test-id="PriceDisplay"]` is NOT unique. On the real page it appears 36 times: twice
  for this product, and 34 more inside sponsored and recommendation tiles. The same is true of
  `StandardPricingPrice-SALE` (16) and `-PREVIOUS` (17). An adapter that takes the first match
  in document order happens to be right today and is one layout change away from reporting a
  sponsored sofa's price as this product's.

  So a sponsored tile is included below, carrying its own SALE/PREVIOUS/PriceDisplay trio at
  $940.00 was $1,610.00. An adapter that returns those numbers is wrong. The scoping selector
  that holds is `[data-node-id^="ListingPricing::"]`, which is unique on the real page (1 of 1)
  because the node id is generated per listing, not per tile.
-->
