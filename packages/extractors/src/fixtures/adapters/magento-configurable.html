<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Alpenrose Daunenjacke — Bergsport</title>
    <link rel="canonical" href="https://bergsport.example/alpenrose-daunenjacke.html" />
    <meta name="generator" content="Magento 2.4.7" />
    <meta itemprop="priceCurrency" content="EUR" />
  </head>
  <body class="catalog-product-view">
    <div class="product-info-main">
      <h1 class="page-title"><span class="base">Alpenrose Daunenjacke</span></h1>

      <div class="product-info-price">
        <!--
          The rendered text is "279,00 €" — a European format the generic parser has to
          reason about. Magento also writes the unambiguous number into
          data-price-amount, which is what the adapter reads.
        -->
        <span class="old-price">
          <span class="price-container" data-price-type="oldPrice" data-price-amount="349.0000">
            <span class="price">349,00 €</span>
          </span>
        </span>
        <span
          class="price-container price-final_price"
          data-price-type="finalPrice"
          data-price-amount="279.0000"
        >
          <span class="price">279,00 €</span>
        </span>
      </div>

      <div class="product-info-stock-sku">
        <div class="stock available"><span>Auf Lager</span></div>
        <div class="product attribute sku">
          <div class="type">Art.-Nr.</div>
          <div class="value">ALP-DJ-2201</div>
        </div>
      </div>

      <div class="swatch-opt">
        <div class="swatch-attribute size" data-attribute-code="size">
          <span class="swatch-attribute-label">Größe</span>
          <span class="swatch-attribute-selected-option">M</span>
        </div>
        <div class="swatch-attribute color" data-attribute-code="color">
          <span class="swatch-attribute-label">Farbe</span>
          <span class="swatch-attribute-selected-option">Preiselbeere</span>
        </div>
      </div>
    </div>

    <div class="product media">
      <img src="/media/catalog/product/alpenrose.jpg" alt="" />
    </div>
  </body>
</html>
