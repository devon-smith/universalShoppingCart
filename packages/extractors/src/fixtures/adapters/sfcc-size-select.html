<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trailhead Merino Sock — Fieldcraft</title>
  </head>
  <body>
    <div class="product-detail" data-pid="TMS-0091-GRY">
      <h1 class="product-name">Trailhead Merino Sock</h1>

      <div class="prices">
        <span class="sales"><span class="value" content="24.00">$24.00</span></span>
      </div>

      <div class="attributes">
        <!-- A size dropdown rather than swatches, and no `.selected-value` to read. -->
        <div class="attribute" data-attr="size">
          <label class="non-input-label" for="size-select">Size</label>
          <select id="size-select" class="select-size">
            <option value="">Select size</option>
            <option value="M" selected>Medium (M)</option>
            <option value="L">Large (L)</option>
          </select>
        </div>
      </div>

      <div class="availability">
        <div class="availability-msg">Out of Stock</div>
      </div>
    </div>
  </body>
</html>
