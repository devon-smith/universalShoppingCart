<!doctype html>
<html lang="en">
  <head>
    <title>Solstice Desk Lamp — Lumen Works</title>
  </head>
  <body>
    <main>
      <div class="product-gallery">
        <img src="/assets/solstice-1.jpg" alt="Solstice Desk Lamp" />
      </div>

      <h1 class="product-title">Solstice Desk Lamp</h1>
      <span itemprop="brand">Lumen Works</span>

      <p>
        <span itemprop="price" content="129.00">$129.00</span>
        <meta itemprop="priceCurrency" content="USD" />
        <s class="price--original">$159.00</s>
      </p>

      <fieldset data-option-name="Finish">
        <legend>Finish</legend>
        <label for="finish-brass">Brushed Brass</label>
        <input type="radio" id="finish-brass" name="finish" value="brass" checked />
        <label for="finish-black">Matte Black</label>
        <input type="radio" id="finish-black" name="finish" value="black" />
      </fieldset>

      <label for="bulb">Bulb</label>
      <select id="bulb">
        <option value="">Choose a bulb</option>
        <option value="warm" selected>Warm white</option>
        <option value="cool">Cool white</option>
      </select>

      <button class="add-to-cart" type="button">Add to cart</button>

      <aside>
        <p>Free shipping on orders over $75.00</p>
        <p>Or 4 payments of $32.25</p>
      </aside>
    </main>
  </body>
</html>
